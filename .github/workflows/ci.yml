name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Verify synchronized agent contracts
        run: >-
          python -c "from pathlib import Path;
          assert Path('AGENTS.md').read_bytes() == Path('CLAUDE.md').read_bytes(),
          'AGENTS.md and CLAUDE.md differ'"

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact project constraints
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        mode: [core, gui]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: python -m pip install --upgrade pip && python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Test wheel from an isolated environment
        run: >-
          python tools/wheel_smoke.py
          --wheel-dir wheelhouse
          --mode ${{ matrix.mode }}
          --expected-version 0.2.0
