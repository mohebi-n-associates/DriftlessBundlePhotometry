[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "driftless-bundle-photometry"
version = "0.1.0"
description = "Trace-first multichannel fiber photometry acquisition and NWB recording"
readme = "readme.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Driftless Bundle Photometry contributors"}]
dependencies = [
  "h5py>=3.12,<4",
  "ndx-fiber-photometry>=0.2.3,<0.3",
  "nwbinspector>=0.6,<1",
  "numpy>=2.0,<3",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pynwb>=4.0,<5",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.8,<6.9",
  "pyqtgraph>=0.13.7,<0.15",
]
dev = [
  "driftless-bundle-photometry[gui]",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]

[project.scripts]
dbf = "driftless_photometry.cli:main"
driftless-photometry = "driftless_photometry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driftless_photometry"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["old mescoscope"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
